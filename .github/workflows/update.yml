name: Update Daegu-Gyeongbuk News Dashboard

on:
  schedule:
    # 10분마다 (0,10,20,30,40,50분) 실행. GitHub Actions 스케줄은 몇 분씩 밀릴 수 있습니다.
    - cron: "*/10 * * * *"
  workflow_dispatch: {}   # Actions 탭에서 수동 실행 버튼도 사용 가능
  push:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch news & build data.json
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python fetch_news.py

      - name: Commit updated data.json
        run: |
          git config user.name "news-dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data.json
          git diff --staged --quiet && echo "변경 없음, 커밋 생략" || git commit -m "자동 갱신: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
